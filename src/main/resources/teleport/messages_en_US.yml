help.header: |-
  <gradient:#38bdf8:#7dd3fc>RIME Tools teleport module</gradient>
  <gray>/rime setp|setg [-f] <name> [desc...]</gray>
  <gray>/rime tpp|tpg <name></gray>
  <gray>/rime delp|delg <name></gray>
  <gray>/rime list|listp|listg</gray>
  <gray>/rime descp|descg <name> <desc...></gray>
  <gray>/rime gui</gray>
  <gray>/rime manage <player> (admin)</gray>
  <gray>/rime tp|tphere <player></gray>
  <gray>/rime tpa|tpahere <player></gray>
  <gray>/rime accept|deny [player]</gray>
  <gray>/rime tpaallow|tpadisallow <player></gray>
  <gray>/rime tpaallowlist</gray>
  <gray>/rime back</gray>
